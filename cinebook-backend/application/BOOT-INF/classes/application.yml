server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: cinebook-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinebook}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        enable_lazy_load_no_trans: true
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple   # switch to 'redis' when Redis is running

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:YOUR_GROQ_API_KEY_HERE}
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: 0.7

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:cinebook-super-secret-key-minimum-256-bits-long-for-hs256-algorithm}
  expiration-ms: 86400000       # 24 hours
  refresh-expiration-ms: 604800000  # 7 days

# ===== Razorpay =====
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:cinebook_secret_key}

# ===== TMDB =====
tmdb:
  api-key: ${TMDB_API_KEY:YOUR_TMDB_API_KEY}
  base-url: https://api.themoviedb.org/3
  image-base: https://image.tmdb.org/t/p

# ===== App =====
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://cinebook-h67dklz41-rishiraj02989-5516s-projects.vercel.app}
  seat-lock:
    duration-minutes: 10
  frontend-url: ${FRONTEND_URL:https://cinebook-h67dklz41-rishiraj02989-5516s-projects.vercel.app}

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== SpringDoc / Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
