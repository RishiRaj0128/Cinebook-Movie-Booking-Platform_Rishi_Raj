# deploy/k8s/hpa.yaml
# HorizontalPodAutoscaler for cinebook-backend.
# Scales replicas between 2 and 4 based on 70% average CPU utilization.
#
# PREREQUISITE: Requires metrics-server running in the Kubernetes cluster.
# For a local kind cluster, install metrics-server with the required insecure TLS patch:
#
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl patch -n kube-system deployment/metrics-server --type='json' -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cinebook-backend-hpa
  namespace: cinebook
  labels:
    app: cinebook-backend
    app.kubernetes.io/name: cinebook-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cinebook-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cinebook-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
