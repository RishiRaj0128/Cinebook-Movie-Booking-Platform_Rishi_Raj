apiVersion: v1
kind: ConfigMap
metadata:
  name: cinebook-ai-config
  namespace: default
  labels:
    app.kubernetes.io/name: cinebook-ai-service
    app.kubernetes.io/part-of: cinebook-platform
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  EMBEDDING_MODEL_NAME: "BAAI/bge-small-en-v1.5"
  USE_MOCK_EMBEDDINGS: "false"
  JAVA_BACKEND_URL: "http://cinebook-backend:8080"
  DATABASE_URL: "postgresql+psycopg2://cinebook_ai:production_secure_pass@postgres-service:5432/cinebook"
