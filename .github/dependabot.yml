version: 2
updates:
  # Spring Boot Maven dependencies
  - package-ecosystem: "maven"
    directory: "/cinebook-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # React / Node npm dependencies
  - package-ecosystem: "npm"
    directory: "/cinebook-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
