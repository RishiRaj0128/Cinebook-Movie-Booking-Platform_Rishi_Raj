name: Container Build & Image Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  docker-security-and-publish:
    name: Container Build, Trivy Security Scan & GHCR Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Scan Dockerfiles with Trivy (Config / Best Practices)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build Backend Image
        run: |
          echo "Building backend container image..."
          docker build -t cinebook-backend:${{ github.sha }} ./cinebook-backend

      - name: Build Frontend Image
        id: build-frontend
        run: |
          echo "Building frontend container image..."
          docker build -t cinebook-frontend:${{ github.sha }} ./cinebook-frontend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cinebook-backend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan Frontend Image with Trivy
        if: always() && steps.build-frontend.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cinebook-frontend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # GHCR requires lowercased owner name
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BACKEND_IMAGE="ghcr.io/$OWNER/cinebook-backend"
          FRONTEND_IMAGE="ghcr.io/$OWNER/cinebook-frontend"
          SHA_TAG="${{ github.sha }}"

          # Tag Backend
          docker tag cinebook-backend:$SHA_TAG $BACKEND_IMAGE:$SHA_TAG
          docker tag cinebook-backend:$SHA_TAG $BACKEND_IMAGE:latest

          # Tag Frontend
          docker tag cinebook-frontend:$SHA_TAG $FRONTEND_IMAGE:$SHA_TAG
          docker tag cinebook-frontend:$SHA_TAG $FRONTEND_IMAGE:latest

          # Push Images
          echo "Pushing $BACKEND_IMAGE:$SHA_TAG and $BACKEND_IMAGE:latest..."
          docker push $BACKEND_IMAGE:$SHA_TAG
          docker push $BACKEND_IMAGE:latest

          echo "Pushing $FRONTEND_IMAGE:$SHA_TAG and $FRONTEND_IMAGE:latest..."
          docker push $FRONTEND_IMAGE:$SHA_TAG
          docker push $FRONTEND_IMAGE:latest
