name: Code Quality & Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Code Style (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Checkstyle
        working-directory: ./cinebook-backend
        run: mvn -B checkstyle:check

  frontend-lint:
    name: Frontend Code Style (ESLint & Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cinebook-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./cinebook-frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./cinebook-frontend
        run: npm run lint

      - name: Run Prettier formatting check
        working-directory: ./cinebook-frontend
        run: npm run format:check || echo "::warning::Code style formatting differences detected. Run 'npx prettier --write .' to reformat."
