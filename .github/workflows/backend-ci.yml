name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-build-test:
    name: Backend Build & Verify (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('cinebook-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Verify with Maven
        working-directory: ./cinebook-backend
        run: mvn -B clean verify

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend JUnit Test Report
          path: cinebook-backend/target/surefire-reports/*.xml
          reporter: java-junit
        continue-on-error: true

      - name: Upload Surefire Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: cinebook-backend/target/surefire-reports/
