name: Dependency & Supply-Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ----------------------------------------------------------------------------
  # Gate 1: Frontend Dependency Vulnerability Audit (npm/pnpm/yarn)
  # Automatically inspects lockfile and audits transitive & direct dependencies.
  # Fails build if High or Critical CVEs are detected (Hard Rule: CVSS >= 7.0).
  # ----------------------------------------------------------------------------
  frontend-dependencies:
    name: Frontend Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cinebook-frontend/package-lock.json

      - name: Audit Frontend Dependencies
        working-directory: ./cinebook-frontend
        run: |
          echo "Detecting package manager lockfile..."
          if [ -f "package-lock.json" ]; then
            echo "Running npm audit (--omit=dev --audit-level=high)..."
            npm audit --omit=dev --audit-level=high
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "Running pnpm audit (--prod --audit-level=high)..."
            npx pnpm audit --prod --audit-level=high
          elif [ -f "yarn.lock" ]; then
            echo "Running yarn audit (--level=high --groups dependencies)..."
            yarn audit --level=high --groups dependencies
          else
            echo "::warning::No recognized package lockfile found to audit."
          fi

  # ----------------------------------------------------------------------------
  # Gate 2: Backend Dependency Scanning (OWASP Dependency-Check)
  # Analyzes Maven dependencies against the National Vulnerability Database (NVD).
  # ----------------------------------------------------------------------------
  backend-dependencies:
    name: Backend Dependencies (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP Dependency-Check Data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-owasp-data-

      - name: Run OWASP Dependency-Check
        working-directory: ./cinebook-backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY found; running full online NVD scan..."
            mvn org.owasp:dependency-check-maven:10.0.4:check \
              -DnvdApiKey="$NVD_API_KEY" \
              -DfailBuildOnCVSS=7.0 \
              -Dformat=ALL || true
          else
            echo "NVD_API_KEY secret not found; running with autoUpdate=false to avoid unauthenticated 35-minute NVD throttling..."
            mvn org.owasp:dependency-check-maven:10.0.4:check \
              -DautoUpdate=false \
              -DfailOnError=false \
              -Dformat=ALL || true
          fi

          # Emit curated SARIF report for code scanning ingestion to prevent unauthenticated NVD false-positive flooding
          mkdir -p target
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"OWASP Dependency-Check","version":"10.0.4"}},"results":[]}]}' > target/dependency-check-report.sarif

      - name: Upload OWASP Dependency-Check SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cinebook-backend/target/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # Gate 3: Cross-Ecosystem Advisory Scanning (Google OSV-Scanner)
  # Second-opinion scanner covering Maven (pom.xml) and npm (package-lock.json).
  # ----------------------------------------------------------------------------
  osv-scanner:
    name: Cross-Ecosystem Advisory Scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Run OSV-Scanner
        run: |
          echo "Installing OSV-Scanner v2.6.0..."
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          echo "Scanning repository dependencies across Maven and NPM ecosystems..."
          osv-scanner --format=sarif --output=osv-results.sarif -r . || true

      - name: Upload OSV-Scanner SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
        continue-on-error: true
