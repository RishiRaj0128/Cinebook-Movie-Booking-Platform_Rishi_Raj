services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cinebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinebook"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./cinebook-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cinebook
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./cinebook-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
